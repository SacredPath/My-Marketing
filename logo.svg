<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768" width="1376" height="768">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3c72;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D4FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e0e0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1376" height="768" fill="url(#bgGradient)" rx="20" ry="20"/>
  
  <!-- Doge Icon (simplified Shiba Inu silhouette) -->
  <g transform="translate(100, 150)">
    <!-- Body -->
    <ellipse cx="200" cy="250" rx="120" ry="100" fill="#F7931E" opacity="0.9"/>
    
    <!-- Head -->
    <circle cx="150" cy="180" r="70" fill="#FDB813"/>
    
    <!-- Ears -->
    <path d="M 100 140 L 90 100 L 120 120 Z" fill="#F7931E"/>
    <path d="M 200 130 L 210 90 L 180 110 Z" fill="#F7931E"/>
    
    <!-- Eyes -->
    <circle cx="130" cy="170" r="8" fill="#000"/>
    <circle cx="170" cy="170" r="8" fill="#000"/>
    
    <!-- Nose -->
    <ellipse cx="150" cy="190" rx="6" ry="4" fill="#000"/>
    
    <!-- Tail -->
    <path d="M 300 220 Q 380 180, 360 260 T 340 320" stroke="#F7931E" stroke-width="20" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Text: DOGE -->
  <text x="550" y="320" font-family="Arial, sans-serif" font-size="120" font-weight="bold" fill="url(#textGradient)">
    DOGE
  </text>
  
  <!-- Text: INITIATIVE -->
  <text x="550" y="450" font-family="Arial, sans-serif" font-size="80" font-weight="300" fill="url(#textGradient)">
    INITIATIVE
  </text>
  
  <!-- Tagline -->
  <text x="550" y="550" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" opacity="0.8">
    Trading • Investment • Innovation
  </text>
  
  <!-- Decorative elements -->
  <circle cx="1200" cy="150" r="30" fill="#00D4FF" opacity="0.3"/>
  <circle cx="1250" cy="200" r="20" fill="#ffffff" opacity="0.2"/>
  <circle cx="1150" cy="220" r="15" fill="#00D4FF" opacity="0.4"/>
  
  <circle cx="200" cy="600" r="25" fill="#00D4FF" opacity="0.3"/>
  <circle cx="150" cy="650" r="18" fill="#ffffff" opacity="0.2"/>
  <circle cx="250" cy="640" r="12" fill="#00D4FF" opacity="0.4"/>
</svg>
